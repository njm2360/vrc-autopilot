[project]
name = "vrc-autopilot"
dynamic = ["version"]
description = "VRChat OSC AutoPilot"
readme = "README.md"
authors = [{ name = "njm2360", email = "me@njm2360.com" }]
requires-python = ">=3.12"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
keywords = ["vrchat", "osc", "autopilot", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "mss>=10.2",
    "python-osc>=1.10",
    "matplotlib>=3.11",
    "pydirectinput>=1.0.4",
    "pillow>=12.3.0",
]

[project.urls]
Homepage = "https://github.com/njm2360/vrc-autopilot"
Repository = "https://github.com/njm2360/vrc-autopilot"
Issues = "https://github.com/njm2360/vrc-autopilot/issues"
Changelog = "https://github.com/njm2360/vrc-autopilot/releases"

[project.scripts]
decode-demo = "vrc_autopilot.cli.decode_demo:main"
map-room = "vrc_autopilot.cli.map_room:main"
find-button = "vrc_autopilot.cli.find_button:main"
probe-axes = "vrc_autopilot.cli.probe_axes:main"
calibrate-world = "vrc_autopilot.cli.calibrate_world:main"
bode-margins = "vrc_autopilot.cli.bode_margins:main"
log-video = "vrc_autopilot.cli.log_video:main"

[dependency-groups]
dev = ["pytest>=9.1", "black>=26.5", "ruff>=0.15.22", "pytest-cov>=7"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "src/vrc_autopilot/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vrc_autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/vrc_autopilot/cli/*"]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
